name: "🐛 Bug 报告"
description: 技能运行出错或行为异常
title: "[bug] <技能名>: <现象>"
labels: ["bug"]
body:
  - type: input
    id: skill
    attributes:
      label: 技能名
      placeholder: duoduo-video-edit
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
