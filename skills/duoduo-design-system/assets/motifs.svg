<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- 太阳：放射线 + 圆心 -->
  <symbol id="m-sun" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="50" cy="50" r="16"/>
      <g>
        <line x1="50" y1="8" x2="50" y2="22"/><line x1="50" y1="78" x2="50" y2="92"/>
        <line x1="8" y1="50" x2="22" y2="50"/><line x1="78" y1="50" x2="92" y2="50"/>
        <line x1="20" y1="20" x2="30" y2="30"/><line x1="80" y1="20" x2="70" y2="30"/>
        <line x1="20" y1="80" x2="30" y2="70"/><line x1="80" y1="80" x2="70" y2="70"/>
      </g>
    </g>
  </symbol>

  <!-- 月亮：新月 -->
  <symbol id="m-moon" viewBox="0 0 100 100">
    <path d="M62 12a40 40 0 1 0 0 76 32 32 0 0 1 0-76z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </symbol>

  <!-- 海浪：三层曲线 -->
  <symbol id="m-wave" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M6 34c12-12 24 12 36 0s24-12 36 0 12 12 16 6"/>
      <path d="M6 54c12-12 24 12 36 0s24-12 36 0 12 12 16 6"/>
      <path d="M6 74c12-12 24 12 36 0s24-12 36 0 12 12 16 6"/>
    </g>
  </symbol>

  <!-- 螺旋 -->
  <symbol id="m-spiral" viewBox="0 0 100 100">
    <path d="M50 50m0 0a4 4 0 1 1 8 0a12 12 0 1 1-24 0a20 20 0 1 1 40 0a28 28 0 1 1-56 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- 曼陀罗：同心 + 花瓣 -->
  <symbol id="m-mandala" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="50" cy="50" r="44"/><circle cx="50" cy="50" r="30"/><circle cx="50" cy="50" r="14"/>
      <g>
        <path d="M50 6c10 14 10 30 0 44c-10-14-10-30 0-44z"/>
        <path d="M50 94c10-14 10-30 0-44c-10 14-10 30 0 44z"/>
        <path d="M6 50c14 10 30 10 44 0c-14-10-30-10-44 0z"/>
        <path d="M94 50c-14 10-30 10-44 0c14-10 30-10 44 0z"/>
      </g>
    </g>
  </symbol>

  <!-- 女人×狮：闭眼女人侧颜 + 狮子鬃（单线融合，圆形框架） -->
  <symbol id="m-womanlion" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="50" cy="50" r="44"/>
      <path d="M34 64c0-12 7-20 16-20s16 8 16 20"/>
      <path d="M50 44c-4-6-2-14 4-16"/>
      <path d="M40 40c-2-6 2-12 8-12"/>
      <circle cx="46" cy="50" r="1.4" fill="currentColor"/>
      <path d="M64 40c8-4 14 2 12 10M66 52c8 2 12 10 6 16M60 60c6 6 4 14-4 14"/>
    </g>
  </symbol>

  <!-- 科科佩利：吹笛人形（岩刻风） -->
  <symbol id="m-kokopelli" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="40" cy="26" r="6"/>
      <path d="M40 32c-6 8-10 18-8 30l10 4 8-10"/>
      <path d="M40 40c10-2 18 2 22 10"/>
      <path d="M32 62l-8 14M44 66l4 14"/>
    </g>
  </symbol>

  <!-- 羽毛 -->
  <symbol id="m-feather" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M70 18C40 26 24 50 28 80l4 4c30-4 46-28 38-66z"/>
      <line x1="34" y1="78" x2="66" y2="26"/>
    </g>
  </symbol>

  <!-- 柏柏尔符号：月+星 -->
  <symbol id="m-berber" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 78a30 30 0 1 1 22-52 24 24 0 1 0 0 44 28 28 0 0 1-22 8z"/>
      <path d="M50 30l3 8 8 0-6 6 2 9-7-5-7 5 2-9-6-6 8 0z"/>
    </g>
  </symbol>

  <!-- 箭头/部落 -->
  <symbol id="m-arrow" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <line x1="20" y1="50" x2="80" y2="50"/>
      <path d="M64 34l16 16-16 16"/><path d="M44 34l-16 16 16 16"/>
    </g>
  </symbol>
</svg>
