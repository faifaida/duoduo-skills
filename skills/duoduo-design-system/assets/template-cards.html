<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>多多 · 3:4 社媒卡模板</title>
<style>
  :root{
    --teal:#00b6c5; --teal-light:#1fcedd; --teal-deep:#008d9a;
    --gold:#c99a3f; --brown:#8a6a4a; --red:#6b3a3a;
    --linen:#f1e9da; --paper:#faf6ee; --night:#151a2e; --graphite:#25262b;
    --font-display:'Baskerville','Iowan Old Style','Times New Roman',serif;
    --font-cn:'Noto Serif SC','Source Han Serif SC',serif;
    --font-hand:'Caveat',cursive;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:#ddd6c8; display:flex; justify-content:center; padding:24px; }
  /* 出图尺寸：1080×1440（3:4）。这里用缩放容器方便预览，导出时按此像素裁。 */
  .card{
    width:1080px; height:1440px; background:var(--linen);
    border:40px solid var(--brown);                 /* 统一 40px 线描边框 */
    position:relative; padding:72px 64px; display:flex; flex-direction:column;
    font-family:var(--font-cn); color:var(--graphite);
  }
  .brandbar{ display:flex; align-items:center; gap:16px; }
  .brandbar svg{ width:54px; height:54px; }
  .brandbar .tag{ font-family:var(--font-hand); font-size:30px; color:var(--teal-deep); }
  .title{ font-family:var(--font-display); font-size:78px; line-height:1.05; margin-top:64px; color:var(--night); }
  .title small{ display:block; font-family:var(--font-cn); font-size:34px; color:var(--brown); margin-top:14px; letter-spacing:2px; }
  .points{ margin-top:40px; font-size:28px; line-height:1.9; color:var(--graphite); }
  .points li{ list-style:none; padding-left:34px; position:relative; margin-bottom:10px; }
  .points li::before{ content:'✦'; position:absolute; left:0; color:var(--gold); }
  .visual{ flex:1; margin:40px 0; border-radius:14px; background:
      radial-gradient(120% 90% at 50% 0%, rgba(0,182,197,.18), transparent 60%), var(--paper);
      display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .visual .watermark-hint{ font-size:20px; color:var(--brown); opacity:.6; }
  .cta{ align-self:flex-start; background:var(--red); color:var(--paper);
        font-family:var(--font-cn); font-size:34px; padding:18px 40px; border-radius:50px; }
  /* 底部 50px 留白：专供去 AI 水印处理，天然米底，不放任何文字/水印 */
  .bottom-safe{ height:50px; }
</style>
</head>
<body>
  <div class="card">
    <div class="brandbar">
      <!-- 母题：太阳/曼陀罗线描（单色 brown），从 assets/motifs.svg 取用 -->
      <svg viewBox="0 0 100 100" fill="none" stroke="#8a6a4a" stroke-width="3">
        <circle cx="50" cy="50" r="22"/>
        <g stroke-width="2.4">
          <line x1="50" y1="8" x2="50" y2="24"/><line x1="50" y1="76" x2="50" y2="92"/>
          <line x1="8" y1="50" x2="24" y2="50"/><line x1="76" y1="50" x2="92" y2="50"/>
          <line x1="20" y1="20" x2="32" y2="32"/><line x1="68" y1="68" x2="80" y2="80"/>
          <line x1="80" y1="20" x2="68" y2="32"/><line x1="32" y1="68" x2="20" y2="80"/>
        </g>
      </svg>
      <span class="tag">世斐 · 她局</span>
    </div>

    <h1 class="title">把迷茫<br>过成航线<small>FEIYANG · THE ARCHIPELAGO</small></h1>

    <ul class="points">
      <li>不卖课，只陪你真的走一段</li>
      <li>一个母题，串起你的一年</li>
      <li>访问权 + AI 随时问答</li>
    </ul>

    <div class="visual"><span class="watermark-hint">[ 中部视觉：照片 / 线描插画，去过 AI 水印 ]</span></div>

    <div class="cta">¥49 起 · 私信我</div>
    <div class="bottom-safe"></div>
  </div>
</body>
</html>
